# Single-host deployment. Sufficient for Phase 1 volumes.
#
# IMPORTANT: run exactly one `bot` container. Long polling means two instances
# would both receive every update and duplicate every relayed message. Do not
# add `deploy.replicas`.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexterpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nexterpay_ops}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # No bind mount for backups - pg_dump writes to the host directly, so a
      # root-owned ./backups directory never appears in the project.
    healthcheck:
      # -d matters. Without it pg_isready connects to a database named after
      # the user ("nexterpay"), which does not exist - so Postgres logs a
      # FATAL every 10 seconds forever. The check still passes, because the
      # server answered, so nothing breaks; it just buries real errors under
      # thousands of lines of noise.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexterpay} -d ${POSTGRES_DB:-nexterpay_ops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host - only the bot container reaches it.
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    expose:
      - "6379"

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nexterpay}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nexterpay_ops}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nexterpay}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nexterpay_ops}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      # Without this, `docker compose up -d bot` starts the bot alone and
      # leaves Redis down. The bot then resolves nothing at redis:6379 and,
      # because FSM state is read on every single update, every message
      # raises before reaching a handler. The bot looks alive and answers
      # nothing.
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # No ports. Long polling dials out; nothing needs to reach this container.

volumes:
  pgdata:
